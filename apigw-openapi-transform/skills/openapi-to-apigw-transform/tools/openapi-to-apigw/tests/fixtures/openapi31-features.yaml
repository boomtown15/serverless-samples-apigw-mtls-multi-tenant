openapi: 3.1.0
info:
  title: OpenAPI 3.1 Feature Test
  version: 1.0.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
webhooks:
  newPet:
    post:
      summary: New pet notification
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Pet"
      responses:
        "200":
          description: Webhook processed
servers:
  - url: https://api.example.com/v2
paths:
  /pets:
    get:
      summary: List pets
      responses:
        "200":
          description: A list of pets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Pet"
    post:
      summary: Create pet
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Pet"
      responses:
        "201":
          description: Created
  /pets/{petId}:
    get:
      summary: Get pet by ID
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: A pet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
components:
  schemas:
    Pet:
      type: object
      properties:
        name:
          type: string
        tag:
          # 3.1: type array with null
          type:
            - string
            - "null"
        status:
          # 3.1: const → enum
          const: active
        avatar:
          type: string
          # 3.1: contentEncoding / contentMediaType
          contentEncoding: base64
          contentMediaType: image/png
    NullableAge:
      # 3.1: multi-type array (non-null)
      type:
        - integer
        - string
    TreeNode:
      type: object
      properties:
        value:
          type: string
        children:
          type: array
          items:
            # 3.1: $dynamicRef
            $dynamicRef: "#node"
      $dynamicAnchor: node
