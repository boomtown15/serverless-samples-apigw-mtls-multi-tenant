swagger: "2.0"
info:
  title: Petstore (Swagger 2.0)
  version: "1.0.0"
host: petstore.swagger.io
basePath: /v1
schemes:
  - https
consumes:
  - application/json
produces:
  - application/json
securityDefinitions:
  api_key:
    type: apiKey
    name: x-api-key
    in: header
paths:
  /pets:
    get:
      summary: List all pets
      operationId: listPets
      parameters:
        - name: limit
          in: query
          description: Max items to return
          required: false
          type: integer
          format: int32
          collectionFormat: csv
      responses:
        "200":
          description: A list of pets
          schema:
            type: array
            items:
              $ref: "#/definitions/Pet"
          headers:
            x-next:
              type: string
              description: A link to the next page
        default:
          description: unexpected error
          schema:
            $ref: "#/definitions/Error"
    post:
      summary: Create a pet
      operationId: createPet
      parameters:
        - name: pet
          in: body
          description: Pet to add
          required: true
          schema:
            $ref: "#/definitions/NewPet"
      responses:
        "201":
          description: Created
  /pets/{petId}:
    get:
      summary: Info for a specific pet
      operationId: showPetById
      parameters:
        - name: petId
          in: path
          required: true
          type: string
      responses:
        "200":
          description: Expected response
          schema:
            $ref: "#/definitions/Pet"
definitions:
  Pet:
    type: object
    allOf:
      - $ref: "#/definitions/NewPet"
      - required:
          - id
        properties:
          id:
            type: integer
            format: int64
  NewPet:
    type: object
    required:
      - name
    properties:
      name:
        type: string
      tag:
        type: string
  Error:
    type: object
    required:
      - code
      - message
    properties:
      code:
        type: integer
        format: int32
      message:
        type: string
